name: Build and Deploy Play.Identity.NET Service Container to Azure Kubernetes Service

on:
  push:
    branches:
      - master

env:
  ACR_NAME: playeconomyapp
  IMAGE_NAME: play-identity
  CONTAINER_APP_NAME: play-identity
  RESOURCE_GROUP: play-rg
  AZURE_REGION: eastus
  AKS_CLUSTER: playrg-kube-cluster-ca
  K8S_MANIFEST_PATH: k8s

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image to ACR
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)

          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_NAME:latest \
            --image $IMAGE_NAME:$IMAGE_TAG \
            --build-arg GITHUB_TOKEN=${{ secrets.PAT_GITHUB_TOKEN }} \
            .

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

      # -----------------------------------------
      # NEW: MongoDB secret for Play.Identity
      # -----------------------------------------
      - name: Create Kubernetes secret for MongoDB + Identity
        run: |
          kubectl create secret generic mongodb-secret \
            --from-literal=username="${{ secrets.MONGODB_USERNAME }}" \
            --from-literal=password="${{ secrets.MONGODB_PASSWORD }}" \
            --from-literal=connectionString="${{ secrets.MONGODB_CONNECTION_STRING }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # -----------------------------------------
      # FIX: Update image tag ONLY in Play.Identity manifests
      # -----------------------------------------
      - name: Update image tag in Play.Identity manifests
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          find $K8S_MANIFEST_PATH/Play.Identity -type f \( -name "*.yml" -o -name "*.yaml" \) \
            -exec sed -i "s|IMAGE_TAG_PLACEHOLDER|$IMAGE_TAG|g" {} \;

      # -----------------------------------------
      # APPLY ALL manifests in ALL subfolders
      # -----------------------------------------
      - name: Deploy to AKS
        run: |
          kubectl apply -R -f $K8S_MANIFEST_PATH
