apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: play-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /identity
            pathType: Prefix
            backend:
              service:
                name: play-identity
                port:
                  number: 80

          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: play-catalog
                port:
                  number: 80

          - path: /inventory
            pathType: Prefix
            backend:
              service:
                name: play-inventory
                port:
                  number: 80

          - path: /trading
            pathType: Prefix
            backend:
              service:
                name: play-trading
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: play-frontend
                port:
                  number: 80
